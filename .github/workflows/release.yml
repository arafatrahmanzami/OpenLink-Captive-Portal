name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  frontend:
    name: Build admin frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend-admin/package-lock.json
      - run: cd frontend-admin && npm ci && npm run build
      - uses: actions/upload-artifact@v5
        with:
          name: admin-frontend
          path: frontend/admin
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build linux-${{ matrix.arch }}
    needs: frontend
    runs-on: ubuntu-latest
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64, arm, armv6, mipsle]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: admin-frontend
          path: frontend/admin
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build backend
        shell: bash
        run: |
          cd backend
          export GOOS=linux
          export GOARCH=${{ matrix.arch }}
          case "${{ matrix.arch }}" in
            arm)    export GOARM=7 ;;
            armv6)  export GOARM=6 ;;
            mipsle) export GOMIPS=softfloat ;;
          esac
          go build -ldflags="-s -w" -o voucher_server .
          mv voucher_server ../
          upx --best --lzma ../voucher_server

      - name: Create NESTED release archive
        shell: bash
        run: |
          NAME="OpenLink-Portal-linux-${{ matrix.arch }}"
          mkdir -p "$NAME/opt/voucher" "$NAME/www/voucher" "$NAME/scripts"
          cp voucher_server "$NAME/opt/voucher/"
          cp -r frontend/* "$NAME/www/voucher/"
          cp -r scripts/* "$NAME/scripts/"
          [ -f nodogsplash/nodogsplash.conf ] && cp nodogsplash/nodogsplash.conf "$NAME/"
          [ -f LICENSE ] && cp LICENSE "$NAME/"
          zip -r -9 "$NAME.zip" "$NAME"
          sha256sum "$NAME.zip" > "$NAME.zip.sha256"
          rm -rf "$NAME"

      - uses: actions/upload-artifact@v5
        with:
          name: linux-${{ matrix.arch }}
          path: OpenLink-Portal-linux-${{ matrix.arch }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: linux-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
